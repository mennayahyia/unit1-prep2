<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | مغامرة جيل ألفا</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cairo, Kufam, Silkscreen, Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=Kufam:wght@700;800;900&family=Silkscreen:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF7F2',
            navy: '#0E1726',
            orange: '#FF5226',
            cyan: '#00E5FF',
            yellow: '#FFE800',
            lime: '#10B981',
          },
          fontFamily: {
            arabic: ['Kufam', 'Cairo', 'sans-serif'],
            cairo: ['Cairo', 'sans-serif'],
            pixel: ['Silkscreen', 'monospace'],
            mono: ['Space Mono', 'monospace'],
          },
          boxShadow: {
            'brutal-sm': '2px 2px 0px #0E1726',
            'brutal': '4px 4px 0px #0E1726',
            'brutal-lg': '6px 6px 0px #0E1726',
            'brutal-orange': '4px 4px 0px #FF5226',
            'brutal-cyan': '4px 4px 0px #00E5FF',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF7F2;
      color: #0E1726;
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      background-image: radial-gradient(#0E1726 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .btn-brutal {
      transition: all 0.1s ease-in-out;
    }
    .btn-brutal:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #0E1726 !important;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0E1726;
    }
    ::-webkit-scrollbar-thumb {
      background: #00E5FF;
    }
  </style>
  <script src="app.js"></script>
</head>

<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 selection:bg-orange selection:text-cream">

  <!-- TOP HEADER BAR -->
  <header class="w-full max-w-md sm:max-w-xl flex justify-between items-center bg-white border-2 sm:border-3 border-navy p-2.5 sm:p-3 shadow-brutal z-20">
    
    <!-- Left Side: Grade Badge & Logged User Circle -->
    <div class="flex items-center gap-2.5">
      <!-- Profile Avatar Circle (Top Right/Start) -->
      <div id="userAvatarContainer" class="relative group cursor-pointer" onclick="checkUserProfile()">
        <div id="avatarCircle" class="w-8 h-8 sm:w-9 sm:h-9 bg-yellow border-2 border-navy rounded-full flex items-center justify-center font-black text-xs sm:text-sm shadow-brutal-sm text-navy uppercase">
          👤
        </div>
        <span id="userRoleBadge" class="hidden absolute -bottom-1 -right-1 bg-cyan text-navy border border-navy text-[8px] font-mono px-1 font-bold">
          STD
        </span>
      </div>

      <div class="flex flex-col">
        <span class="font-pixel text-[9px] sm:text-[11px] tracking-wider text-navy font-bold uppercase" dir="ltr">
          ENGLISH • PREP 2
        </span>
        <span id="headerUserName" class="font-arabic text-[11px] font-bold text-orange truncate max-w-[100px] sm:max-w-[140px]">
          زائر
        </span>
      </div>
    </div>

    <!-- Right Side: Clock & Sound Controls -->
    <div class="flex items-center gap-2 sm:gap-3" dir="ltr">
      <div id="clock" class="font-pixel text-[10px] sm:text-xs text-navy bg-cream px-2 py-0.5 border border-navy font-bold">
        00:00:00
      </div>

      <button id="soundToggleBtn" onclick="toggleAudio()" class="btn-brutal p-1 sm:p-1.5 bg-yellow border border-navy shadow-brutal-sm hover:bg-cyan text-navy flex items-center justify-center text-xs" title="تفعيل/كتم الصوت">
        <span id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <!-- MAIN LOGIN CARD -->
  <main class="w-full max-w-md sm:max-w-xl flex-1 flex flex-col justify-center items-center py-6 my-auto">
    
    <div class="w-full bg-cream border-3 border-navy shadow-brutal-lg p-5 sm:p-8 relative">
      
      <!-- Decorative Corner Pins -->
      <div class="absolute -top-2 -left-2 w-4 h-4 bg-orange border border-navy"></div>
      <div class="absolute -bottom-2 -right-2 w-4 h-4 bg-cyan border border-navy"></div>

      <!-- Card Title Header -->
      <div class="text-center mb-6">
        <div class="inline-block bg-yellow border-2 border-navy px-3 py-0.5 font-mono text-xs font-bold shadow-brutal-sm rotate-[-1deg] mb-2" dir="ltr">
          🔐 ACCESS_PORTAL
        </div>
        <h1 class="font-arabic text-3xl sm:text-4xl font-black text-navy">تسجيل الدخول</h1>
        <p class="font-cairo text-xs sm:text-sm text-gray-700 font-bold mt-1">اختر نوع حسابك للبدء في المغامرة</p>
      </div>

      <!-- ROLE SELECTOR TABS -->
      <div class="grid grid-cols-2 gap-2 mb-6">
        <button type="button" id="tabStudent" onclick="switchRole('student')" class="btn-brutal py-2.5 bg-cyan text-navy font-arabic font-black border-2 border-navy shadow-brutal text-sm sm:text-base flex items-center justify-center gap-2">
          <span>🎓</span>
          <span>طـالـب</span>
        </button>
        
        <button type="button" id="tabTeacher" onclick="switchRole('teacher')" class="btn-brutal py-2.5 bg-white text-navy font-arabic font-bold border-2 border-navy shadow-brutal hover:bg-yellow text-sm sm:text-base flex items-center justify-center gap-2">
          <span>👨‍🏫</span>
          <span>معـلـم</span>
        </button>
      </div>

      <!-- STUDENT FORM -->
      <form id="studentForm" onsubmit="handleStudentLogin(event)" class="space-y-4">
        <div>
          <label class="block font-arabic font-bold text-navy text-sm mb-1.5" for="studentName">
            اسم الطالب
          </label>
          <input type="text" id="studentName" required placeholder="أدخل اسمك الثلاثي..." class="w-full bg-white border-2 border-navy p-3 font-cairo font-bold text-navy placeholder-gray-400 focus:outline-none focus:bg-yellow/10 focus:border-orange shadow-brutal-sm text-sm" />
        </div>

        <!-- Avatar Character Selection -->
        <div>
          <label class="block font-arabic font-bold text-navy text-sm mb-1.5">
            اختر شخصيتك الرمزية:
          </label>
          <div class="flex justify-between items-center gap-2 bg-white p-2.5 border-2 border-navy">
            <label class="cursor-pointer">
              <input type="radio" name="studentAvatar" value="🤖" checked class="peer hidden" />
              <span class="w-10 h-10 border-2 border-navy flex items-center justify-center text-xl bg-cream peer-checked:bg-orange peer-checked:text-white shadow-brutal-sm transition-all inline-block">🤖</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="studentAvatar" value="🚀" class="peer hidden" />
              <span class="w-10 h-10 border-2 border-navy flex items-center justify-center text-xl bg-cream peer-checked:bg-cyan peer-checked:text-navy shadow-brutal-sm transition-all inline-block">🚀</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="studentAvatar" value="👾" class="peer hidden" />
              <span class="w-10 h-10 border-2 border-navy flex items-center justify-center text-xl bg-cream peer-checked:bg-yellow peer-checked:text-navy shadow-brutal-sm transition-all inline-block">👾</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="studentAvatar" value="⚡" class="peer hidden" />
              <span class="w-10 h-10 border-2 border-navy flex items-center justify-center text-xl bg-cream peer-checked:bg-lime peer-checked:text-white shadow-brutal-sm transition-all inline-block">⚡</span>
            </label>
          </div>
        </div>

        <button type="submit" class="btn-brutal w-full py-3.5 bg-orange text-white font-arabic text-xl font-black border-2 border-navy shadow-brutal hover:bg-yellow hover:text-navy transition-all flex items-center justify-center gap-2 mt-2">
          <span>دخول اللعبة</span>
          <span class="font-mono text-xl">←</span>
        </button>
      </form>

      <!-- TEACHER FORM (Hidden by default) -->
      <form id="teacherForm" onsubmit="handleTeacherLogin(event)" class="space-y-4 hidden">
        <div>
          <label class="block font-arabic font-bold text-navy text-sm mb-1.5" for="teacherName">
            اسم المعلم
          </label>
          <input type="text" id="teacherName" required placeholder="أدخل اسم المعلم..." class="w-full bg-white border-2 border-navy p-3 font-cairo font-bold text-navy placeholder-gray-400 focus:outline-none focus:bg-yellow/10 focus:border-orange shadow-brutal-sm text-sm" />
        </div>

        <div>
          <label class="block font-arabic font-bold text-navy text-sm mb-1.5" for="teacherPass">
            كلمة السر
          </label>
          <input type="password" id="teacherPass" required placeholder="••••••" class="w-full bg-white border-2 border-navy p-3 font-mono font-bold text-navy placeholder-gray-400 focus:outline-none focus:bg-yellow/10 focus:border-orange shadow-brutal-sm text-sm" />
        </div>

        <!-- Error Notification Banner -->
        <div id="errorMessage" class="hidden bg-orange/20 border-2 border-orange text-orange font-bold font-cairo text-xs p-2.5 text-center">
          ⚠️ كلمة السر غير صحيحة! (جرّب: 123)
        </div>

        <button type="submit" class="btn-brutal w-full py-3.5 bg-yellow text-navy font-arabic text-xl font-black border-2 border-navy shadow-brutal hover:bg-lime hover:text-white transition-all flex items-center justify-center gap-2 mt-2">
          <span>دخول لوحة التحكم</span>
          <span class="font-mono text-xl">📊</span>
        </button>
      </form>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full max-w-md sm:max-w-xl text-center pt-3 pb-1 text-[11px] sm:text-xs font-mono text-gray-600 flex justify-between items-center border-t border-gray-300" dir="ltr">
    <span>PREP 2 • UNIT 1 DIGI-QUEST</span>
    <span class="font-bold text-navy">مغامرة جيل ألفا © 2026</span>
  </footer>

  <!-- JAVASCRIPT: LOGIC & AUDIO SYNTHESIZER -->
  <script>
    let activeRole = 'student';

    // --- AUDIO SYNTHESIZER ---
    let audioCtx = null;
    let audioMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playAudio(type) {
      if (audioMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'blip') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'success') {
          const notes = [330, 440, 554, 659];
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.type = 'square';
            noteOsc.frequency.setValueAtTime(freq, now + idx * 0.05);
            noteGain.gain.setValueAtTime(0.1, now + idx * 0.05);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.1);
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);
            noteOsc.start(now + idx * 0.05);
            noteOsc.stop(now + idx * 0.05 + 0.1);
          });
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.setValueAtTime(110, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch(e) {
        console.log("Audio play error", e);
      }
    }

    function toggleAudio() {
      audioMuted = !audioMuted;
      const soundIcon = document.getElementById('soundIcon');
      const soundBtn = document.getElementById('soundToggleBtn');
      if (audioMuted) {
        soundIcon.textContent = '🔇';
        soundBtn.classList.add('opacity-60');
      } else {
        soundIcon.textContent = '🔊';
        soundBtn.classList.remove('opacity-60');
        playAudio('blip');
      }
    }

    // --- REALTIME CLOCK ---
    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hrs}:${mins}:${secs}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- ROLE SWITCHING TABS ---
    function switchRole(role) {
      playAudio('blip');
      activeRole = role;
      const btnStudent = document.getElementById('tabStudent');
      const btnTeacher = document.getElementById('tabTeacher');
      const formStudent = document.getElementById('studentForm');
      const formTeacher = document.getElementById('teacherForm');

      if (role === 'student') {
        btnStudent.className = "btn-brutal py-2.5 bg-cyan text-navy font-arabic font-black border-2 border-navy shadow-brutal text-sm sm:text-base flex items-center justify-center gap-2";
        btnTeacher.className = "btn-brutal py-2.5 bg-white text-navy font-arabic font-bold border-2 border-navy shadow-brutal hover:bg-yellow text-sm sm:text-base flex items-center justify-center gap-2";
        formStudent.classList.remove('hidden');
        formTeacher.classList.add('hidden');
      } else {
        btnTeacher.className = "btn-brutal py-2.5 bg-yellow text-navy font-arabic font-black border-2 border-navy shadow-brutal text-sm sm:text-base flex items-center justify-center gap-2";
        btnStudent.className = "btn-brutal py-2.5 bg-white text-navy font-arabic font-bold border-2 border-navy shadow-brutal hover:bg-cyan text-sm sm:text-base flex items-center justify-center gap-2";
        formTeacher.classList.remove('hidden');
        formStudent.classList.add('hidden');
      }
    }

    // --- LOGIN HANDLERS ---
    function handleStudentLogin(e) {
      e.preventDefault();
      const name = document.getElementById('studentName').value.trim();
      const avatar = document.querySelector('input[name="studentAvatar"]:checked').value;
      if (!name) return;

      playAudio('success');
      updateHeaderUI({ name: name, role: 'student', avatar: avatar });

      // تسجيل الطالب (ويكمل من حيث توقف لو دخل بنفس الاسم قبل كده)
      GA.loginStudent(name, avatar).then(() => {
        setTimeout(() => { window.location.href = 'index.html'; }, 300); // صفحة البدء ثم فهرس الدروس
      });
    }

    function handleTeacherLogin(e) {
      e.preventDefault();
      const name = document.getElementById('teacherName').value.trim();
      const pass = document.getElementById('teacherPass').value.trim();
      const errBox = document.getElementById('errorMessage');

      if (pass === '123') {
        errBox.classList.add('hidden');
        GA.loginTeacher(name);
        playAudio('success');

        setTimeout(() => {
          window.location.href = 'dashboard.html'; // الانتقال للوحة تحكم الطلاب
        }, 300);
      } else {
        playAudio('error');
        errBox.classList.remove('hidden');
      }
    }

    // --- UPDATE HEADER USER UI ---
    function updateHeaderUI(user) {
      if (!user) return;
      document.getElementById('avatarCircle').textContent = user.avatar || '👤';
      document.getElementById('headerUserName').textContent = user.name;
      
      const roleBadge = document.getElementById('userRoleBadge');
      roleBadge.classList.remove('hidden');
      roleBadge.textContent = user.role === 'teacher' ? 'TCH' : 'STD';
    }

    // Load existing session if present
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('gameUser');
      if (savedUser) {
        const user = JSON.parse(savedUser);
        updateHeaderUI(user);
        if (user.role === 'student' && user.name) {
          document.getElementById('studentName').value = user.name;
        }
      }
    });

    function checkUserProfile() {
      const savedUser = localStorage.getItem('gameUser');
      if (!savedUser) return;
      const user = JSON.parse(savedUser);
      window.location.href = user.role === 'teacher' ? 'dashboard.html' : 'stats.html';
    }
  </script>
</body>
</html>
