<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Digital Bridge | 01 - Before You Start</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Kufam:wght@700;800;900&family=Silkscreen:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF7F2',
            navy: '#0E1726',
            orange: '#FF5226',
            cyan: '#00E5FF',
            yellow: '#FFE800',
            lime: '#10B981',
          },
          fontFamily: {
            arabic: ['Kufam', 'Cairo', 'sans-serif'],
            cairo: ['Cairo', 'sans-serif'],
            pixel: ['Silkscreen', 'monospace'],
            mono: ['Space Mono', 'monospace'],
          },
          boxShadow: {
            'brutal-sm': '2px 2px 0px #0E1726',
            'brutal': '4px 4px 0px #0E1726',
            'brutal-lg': '5px 5px 0px #0E1726',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF7F2;
      color: #0E1726;
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      background-image: radial-gradient(#0E1726 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .btn-brutal {
      transition: all 0.1s ease-in-out;
    }
    .btn-brutal:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #0E1726 !important;
    }

    .chip-btn {
      transition: all 0.15s ease;
    }
    .chip-btn.active {
      background-color: #FFE800 !important;
      border-color: #0E1726 !important;
      box-shadow: 2px 2px 0px #0E1726;
    }
  </style>
  <script src="app.js"></script>
</head>

<body data-ga-page="l3-1" class="min-h-screen flex flex-col justify-between items-center p-3 sm:p-5 selection:bg-orange selection:text-cream">

  <!-- TOP HEADER & PROGRESS BAR -->
  <header class="w-full max-w-xl flex justify-between items-center bg-white border-2 border-navy p-2.5 sm:p-3 shadow-brutal z-20">
    <div class="flex items-center gap-2" dir="ltr">
      <span class="bg-cyan text-navy font-pixel text-[10px] sm:text-xs px-2 py-0.5 border border-navy font-bold">
        UNIT 01 / LESSON 03
      </span>
    </div>

    <div class="flex items-center gap-2">
      <div class="bg-yellow text-navy font-pixel text-[11px] sm:text-xs px-2.5 py-0.5 border border-navy font-black shadow-brutal-sm" dir="ltr">
        01 / 05
      </div>
      <button id="soundToggleBtn" onclick="toggleAudio()" class="btn-brutal p-1 bg-white border border-navy text-xs" title="الصوت">
        <span id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-xl flex-1 flex flex-col justify-center items-center gap-4 py-3 my-auto">

    <!-- TITLE & HEADING SECTION -->
    <section class="w-full flex flex-col items-center text-center gap-1.5">
      <div class="inline-flex items-center gap-1.5 bg-orange text-white border-2 border-navy px-3 py-0.5 shadow-brutal-sm font-pixel text-xs sm:text-sm font-bold rotate-[-1deg]" dir="ltr">
        <span>⚡ BEFORE YOU START</span>
      </div>

      <p class="font-mono text-sm sm:text-base text-navy font-bold mt-0.5" dir="ltr">
        Let's Get Started! 🌐
      </p>

      <h1 class="font-arabic font-black text-2xl sm:text-3xl text-navy flex items-center justify-center gap-2">
        <span>The Digital Bridge</span>
        <span class="text-orange text-xl sm:text-2xl">🌉</span>
      </h1>
    </section>

    <!-- INTERACTIVE CARDS CONTAINER -->
    <section class="w-full bg-white border-2 sm:border-3 border-navy p-4 sm:p-5 shadow-brutal flex flex-col gap-4">
      
      <!-- QUESTION 1 -->
      <div class="space-y-2" dir="ltr">
        <div class="bg-yellow border-2 border-navy p-3 text-navy font-mono font-bold text-sm sm:text-base flex items-center justify-between">
          <span>1. How often do you use the internet?</span>
          <span>📡</span>
        </div>

        <p class="font-arabic font-bold text-xs text-navy" dir="rtl">اختر خياراً أو اكتب إجابتك:</p>

        <!-- Quick Choice Chips -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          <button onclick="selectChoice('q1', 'Every day', this)" class="chip-btn btn-brutal p-2 bg-cream border-2 border-navy font-mono text-xs font-bold text-navy">
            Every day
          </button>
          <button onclick="selectChoice('q1', 'A few times a week', this)" class="chip-btn btn-brutal p-2 bg-cream border-2 border-navy font-mono text-xs font-bold text-navy">
            A few times a week
          </button>
          <button onclick="selectChoice('q1', 'Only on weekends', this)" class="chip-btn btn-brutal p-2 bg-cream border-2 border-navy font-mono text-xs font-bold text-navy col-span-2 sm:col-span-1">
            Only on weekends
          </button>
        </div>

        <input type="text" id="q1_custom" oninput="checkCompletion()" placeholder="Or type your own answer here..." class="w-full border-2 border-navy p-2.5 font-mono text-xs text-navy bg-cream focus:bg-white focus:outline-none" />
      </div>

      <hr class="border-navy border-dashed" />

      <!-- QUESTION 2 -->
      <div class="space-y-2" dir="ltr">
        <div class="bg-cyan border-2 border-navy p-3 text-navy font-mono font-bold text-sm sm:text-base flex items-center justify-between">
          <span>2. What do you use it for?</span>
          <span>🎮</span>
        </div>

        <p class="font-arabic font-bold text-xs text-navy" dir="rtl">اختر الخيارات المناسبة لك:</p>

        <!-- Quick Choice Chips -->
        <div class="grid grid-cols-2 gap-2">
          <button onclick="toggleMultiChoice('q2', 'Social media & memes', this)" class="chip-btn btn-brutal p-2 bg-cream border-2 border-navy font-mono text-xs font-bold text-navy">
            + Social media & memes
          </button>
          <button onclick="toggleMultiChoice('q2', 'Videos & Gaming', this)" class="chip-btn btn-brutal p-2 bg-cream border-2 border-navy font-mono text-xs font-bold text-navy">
            + Videos & Gaming
          </button>
          <button onclick="toggleMultiChoice('q2', 'Learning & School', this)" class="chip-btn btn-brutal p-2 bg-cream border-2 border-navy font-mono text-xs font-bold text-navy">
            + Learning & School
          </button>
          <button onclick="toggleMultiChoice('q2', 'Connecting with friends', this)" class="chip-btn btn-brutal p-2 bg-cream border-2 border-navy font-mono text-xs font-bold text-navy">
            + Connecting with friends
          </button>
        </div>

        <input type="text" id="q2_custom" oninput="checkCompletion()" placeholder="Or type other activities here..." class="w-full border-2 border-navy p-2.5 font-mono text-xs text-navy bg-cream focus:bg-white focus:outline-none" />
      </div>

    </section>

    <!-- NEXT STEP BUTTON -->
    <section class="w-full pt-1">
      <button id="nextBtn" onclick="goToReadingPassage()" class="btn-brutal w-full py-3.5 bg-orange text-white font-arabic text-base sm:text-lg font-black border-2 border-navy shadow-brutal hover:bg-yellow hover:text-navy cursor-pointer flex items-center justify-center gap-2">
        <span>الانتقال إلى النص القرائي (Reading Text)</span>
        <span class="font-mono text-xl">←</span>
      </button>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="w-full max-w-xl text-center pt-2 pb-1 text-[11px] font-mono text-gray-600 flex justify-between items-center border-t border-gray-300" dir="ltr">
    <span>LESSON 02 • BEFORE YOU START</span>
    <span class="font-bold text-navy">مغامرة جيل ألفا © 2026</span>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let audioCtx = null;
    let audioMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playAudio(type) {
      if (audioMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'blip') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'next') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.type = 'square';
            noteOsc.frequency.setValueAtTime(freq, now + idx * 0.05);
            noteGain.gain.setValueAtTime(0.1, now + idx * 0.05);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.1);
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);
            noteOsc.start(now + idx * 0.05);
            noteOsc.stop(now + idx * 0.05 + 0.1);
          });
        }
      } catch(e) {}
    }

    function toggleAudio() {
      audioMuted = !audioMuted;
      document.getElementById('soundIcon').textContent = audioMuted ? '🔇' : '🔊';
    }

    let q1Choice = '';
    function selectChoice(group, val, btn) {
      playAudio('blip');
      q1Choice = val;
      const parent = btn.parentElement;
      parent.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('q1_custom').value = val;
    }

    let q2Choices = [];
    function toggleMultiChoice(group, val, btn) {
      playAudio('blip');
      if (btn.classList.contains('active')) {
        btn.classList.remove('active');
        q2Choices = q2Choices.filter(item => item !== val);
      } else {
        btn.classList.add('active');
        q2Choices.push(val);
      }
      document.getElementById('q2_custom').value = q2Choices.join(', ');
    }

    function goToReadingPassage() {
      playAudio('next');
      window.location.href = "l3-2-reading.html";
    }
  </script>
</body>
</html>
