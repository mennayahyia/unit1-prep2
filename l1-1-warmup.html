<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Gen Alpha | Warm-up</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Kufam:wght@700;800;900&family=Silkscreen:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF7F2',
            navy: '#0E1726',
            orange: '#FF5226',
            cyan: '#00E5FF',
            yellow: '#FFE800',
            lime: '#10B981',
            softRed: '#FF4D4D',
          },
          fontFamily: {
            arabic: ['Kufam', 'Cairo', 'sans-serif'],
            cairo: ['Cairo', 'sans-serif'],
            pixel: ['Silkscreen', 'monospace'],
            mono: ['Space Mono', 'monospace'],
          },
          boxShadow: {
            'brutal-sm': '2px 2px 0px #0E1726',
            'brutal': '4px 4px 0px #0E1726',
            'brutal-lg': '5px 5px 0px #0E1726',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF7F2;
      color: #0E1726;
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      background-image: radial-gradient(#0E1726 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .btn-brutal {
      transition: all 0.1s ease-in-out;
    }
    .btn-brutal:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0px #0E1726 !important;
    }

    /* Option Card Styling */
    .option-card {
      transition: all 0.15s ease;
    }
    .option-card:hover {
      transform: translateY(-2px);
    }
  </style>
  <script src="app.js"></script>
</head>

<body data-ga-page="l1-1" class="min-h-screen flex flex-col justify-between items-center p-3 sm:p-5 selection:bg-orange selection:text-cream">

  <!-- TOP HEADER & PROGRESS BAR -->
  <header class="w-full max-w-xl flex justify-between items-center bg-white border-2 border-navy p-2.5 sm:p-3 shadow-brutal z-20">
    <div class="flex items-center gap-2" dir="ltr">
      <span class="bg-cyan text-navy font-pixel text-[10px] sm:text-xs px-2 py-0.5 border border-navy font-bold">
        UNIT 01 / LESSON 01
      </span>
    </div>

    <!-- Step Progress Tracker -->
    <div class="flex items-center gap-2">
      <div class="bg-yellow text-navy font-pixel text-[11px] sm:text-xs px-2.5 py-0.5 border border-navy font-black shadow-brutal-sm" dir="ltr">
        01 / 05
      </div>
      <button id="soundToggleBtn" onclick="toggleAudio()" class="btn-brutal p-1 bg-white border border-navy text-xs" title="الصوت">
        <span id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <!-- MAIN WARM-UP CONTAINER -->
  <main class="w-full max-w-xl flex-1 flex flex-col justify-center items-center gap-4 py-3 my-auto">

    <!-- SCREEN TITLE & HEADING SECTION -->
    <section class="w-full flex flex-col items-center text-center gap-1.5">
      
      <!-- Orange WARMUP Badge Sticker -->
      <div class="inline-flex items-center gap-1 bg-orange text-white border-2 border-navy px-3 py-0.5 shadow-brutal-sm font-pixel text-xs sm:text-sm font-bold rotate-[-1deg]" dir="ltr">
        <span>⚡ WARMUP</span>
      </div>

      <!-- Line 1: Before we start, let's think! 🧠 -->
      <p class="font-mono text-sm sm:text-base text-navy font-bold mt-0.5" dir="ltr">
        Before we start, let's think! 🧠
      </p>

      <!-- Line 2 (Centered below): Meet Gen Alpha ✨ -->
      <h1 class="font-arabic font-black text-2xl sm:text-3xl text-navy flex items-center justify-center gap-2">
        <span>Meet Gen Alpha</span>
        <span class="text-orange text-xl sm:text-2xl">✨</span>
      </h1>
    </section>

    <!-- QUESTION CARD -->
    <section class="w-full bg-white border-2 sm:border-3 border-navy p-4 sm:p-5 shadow-brutal flex flex-col gap-3 relative">
      
      <!-- Question Prompt Box -->
      <div class="bg-yellow border-2 border-navy p-3 sm:p-3.5 text-navy font-black text-base sm:text-lg flex justify-between items-center gap-2" dir="ltr">
        <span class="leading-tight">What does <u class="decoration-orange decoration-3">“generation”</u> mean?</span>
        <span class="text-xl">❓</span>
      </div>

      <p class="font-arabic font-bold text-xs sm:text-sm text-navy">
      
      </p>

      <!-- OPTIONS LIST -->
      <div class="flex flex-col gap-2.5 mt-0.5" dir="ltr">
        
        <!-- OPTION A (CORRECT) -->
        <button id="optA" onclick="checkAnswer('A')" class="option-card btn-brutal w-full p-3 bg-cream border-2 border-navy text-left flex items-center gap-3 shadow-brutal-sm hover:bg-cyan/20 group">
          <span class="w-7 h-7 sm:w-8 sm:h-8 bg-navy text-cream font-pixel text-xs sm:text-sm flex items-center justify-center border border-navy group-hover:bg-orange group-hover:text-white flex-shrink-0 font-bold">
            A
          </span>
          <span class="font-mono font-bold text-xs sm:text-sm text-navy leading-snug">
            A group of people born around the same time.
          </span>
        </button>

        <!-- OPTION B -->
        <button id="optB" onclick="checkAnswer('B')" class="option-card btn-brutal w-full p-3 bg-cream border-2 border-navy text-left flex items-center gap-3 shadow-brutal-sm hover:bg-yellow/30 group">
          <span class="w-7 h-7 sm:w-8 sm:h-8 bg-navy text-cream font-pixel text-xs sm:text-sm flex items-center justify-center border border-navy group-hover:bg-orange group-hover:text-white flex-shrink-0 font-bold">
            B
          </span>
          <span class="font-mono font-bold text-xs sm:text-sm text-navy leading-snug">
            A type of digital device.
          </span>
        </button>

        <!-- OPTION C -->
        <button id="optC" onclick="checkAnswer('C')" class="option-card btn-brutal w-full p-3 bg-cream border-2 border-navy text-left flex items-center gap-3 shadow-brutal-sm hover:bg-yellow/30 group">
          <span class="w-7 h-7 sm:w-8 sm:h-8 bg-navy text-cream font-pixel text-xs sm:text-sm flex items-center justify-center border border-navy group-hover:bg-orange group-hover:text-white flex-shrink-0 font-bold">
            C
          </span>
          <span class="font-mono font-bold text-xs sm:text-sm text-navy leading-snug">
            A popular video on the internet.
          </span>
        </button>

      </div>
    </section>

    <!-- CONSTRUCTIVE FEEDBACK PANEL (DYNAMIC) -->
    <section id="feedbackPanel" class="w-full bg-white border-2 border-navy p-3 sm:p-4 shadow-brutal hidden transition-all">
      <div class="flex items-start gap-3">
        <!-- 2D Retro Mascot Icon -->
        <div id="mascotIcon" class="w-9 h-9 bg-cyan border border-navy flex items-center justify-center text-lg flex-shrink-0">
          🤖
        </div>

        <div class="flex-1 space-y-0.5">
          <div id="feedbackHeader" class="font-arabic font-black text-sm flex items-center gap-2">
            <!-- Dynamic Status Title -->
          </div>
          <p id="feedbackBody" class="font-arabic font-semibold text-xs sm:text-sm text-navy leading-relaxed">
            <!-- Dynamic Constructive Explanation -->
          </p>
        </div>
      </div>
    </section>

    <!-- NEXT STEP BUTTON -->
    <section class="w-full pt-1">
      <button id="nextBtn" onclick="startFullQuest()" disabled class="btn-brutal w-full py-3.5 bg-gray-300 text-gray-500 font-arabic text-base sm:text-lg font-black border-2 border-navy shadow-brutal cursor-not-allowed flex items-center justify-center gap-2">
        <span>الانتقال لنص القراءة</span>
        <span class="font-mono text-xl">←</span>
      </button>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="w-full max-w-xl text-center pt-2 pb-1 text-[11px] font-mono text-gray-600 flex justify-between items-center border-t border-gray-300" dir="ltr">
    <span>DEMO MODE • NON-EVALUATIVE WARMUP</span>
    <span class="font-bold text-navy">مغامرة جيل ألفا © 2026</span>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- WEB AUDIO API SYNTHESIZER ---
    let audioCtx = null;
    let audioMuted = false;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playAudio(type) {
      if (audioMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.type = 'square';
            noteOsc.frequency.setValueAtTime(freq, now + idx * 0.05);
            noteGain.gain.setValueAtTime(0.1, now + idx * 0.05);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.1);
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);
            noteOsc.start(now + idx * 0.05);
            noteOsc.stop(now + idx * 0.05 + 0.1);
          });
        } else if (type === 'try') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.15);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch(e) {}
    }

    function toggleAudio() {
      audioMuted = !audioMuted;
      document.getElementById('soundIcon').textContent = audioMuted ? '🔇' : '🔊';
    }

    // --- CONSTRUCTIVE FEEDBACK LOGIC ---
    function checkAnswer(choice) {
      const feedbackPanel = document.getElementById('feedbackPanel');
      const feedbackHeader = document.getElementById('feedbackHeader');
      const feedbackBody = document.getElementById('feedbackBody');
      const mascotIcon = document.getElementById('mascotIcon');
      const nextBtn = document.getElementById('nextBtn');

      // Reset Button Styles
      ['optA', 'optB', 'optC'].forEach(id => {
        const btn = document.getElementById(id);
        btn.classList.remove('bg-lime/30', 'border-lime', 'bg-orange/20', 'border-orange');
      });

      feedbackPanel.classList.remove('hidden');

      if (choice === 'A') {
        playAudio('correct');
        document.getElementById('optA').classList.add('bg-lime/30', 'border-lime');
        
        mascotIcon.textContent = '🎉';
        mascotIcon.className = 'w-9 h-9 bg-lime border border-navy flex items-center justify-center text-lg flex-shrink-0';
        
        feedbackHeader.className = 'font-arabic font-black text-sm text-emerald-800 flex items-center gap-2';
        feedbackHeader.innerHTML = '<span>إجابة ممتازة ومضبوطة! 👏</span>';
        
        feedbackBody.textContent = 'كلمة Generation تعني "جيل"، وهما مجموعة الناس اللي اتولدوا في فترة زمنية متقاربة (زي جيل ألفا المولودين بين 2010 و 2024).';

      } else if (choice === 'B') {
        playAudio('try');
        document.getElementById('optB').classList.add('bg-orange/20', 'border-orange');
        
        mascotIcon.textContent = '💡';
        mascotIcon.className = 'w-9 h-9 bg-yellow border border-navy flex items-center justify-center text-lg flex-shrink-0';

        feedbackHeader.className = 'font-arabic font-black text-sm text-navy flex items-center gap-2';
        feedbackHeader.innerHTML = '<span>فكر تاني بأسلوب أعمق! 🧐</span>';
        
        feedbackBody.textContent = 'الأجهزة الرقمية بنسميها Digital Devices (زي الموبايل أو التابلت)، لكن كلمة Generation بتعبر عن البشر والأجيال اللي بيستخدموا التكنولوجيا دي.';

      } else if (choice === 'C') {
        playAudio('try');
        document.getElementById('optC').classList.add('bg-orange/20', 'border-orange');
        
        mascotIcon.textContent = '💡';
        mascotIcon.className = 'w-9 h-9 bg-yellow border border-navy flex items-center justify-center text-lg flex-shrink-0';

        feedbackHeader.className = 'font-arabic font-black text-sm text-navy flex items-center gap-2';
        feedbackHeader.innerHTML = '<span>قريب.. بس مش هي! 🎬</span>';
        
        feedbackBody.textContent = 'الفيديو الشائع بنسميه Viral Video أو Trending Video. أما Generation فهي الجيل كاملاً من الشباب والطلاب اللي بيشوفوا المحتوى ده!';
      }

      // Unlock Next Button
      nextBtn.disabled = false;
      nextBtn.className = 'btn-brutal w-full py-3.5 bg-orange text-white font-arabic text-base sm:text-lg font-black border-2 border-navy shadow-brutal hover:bg-yellow hover:text-navy cursor-pointer flex items-center justify-center gap-2';
    }

function startFullQuest() {
  window.location.href = 'l1-2-reading.html';
}
  </script>
</body>
</html>
