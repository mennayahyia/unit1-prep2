    // --- SOUND SYNTHESIZER ---
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playAudio(type) {
      if (audioMuted) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.type = 'square';
            noteOsc.frequency.setValueAtTime(freq, now + idx * 0.05);
            noteGain.gain.setValueAtTime(0.1, now + idx * 0.05);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.1);
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);
            noteOsc.start(now + idx * 0.05);
            noteOsc.stop(now + idx * 0.05 + 0.1);
          });
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'fanfare') {
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.type = 'triangle';
            noteOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
            noteGain.gain.setValueAtTime(0.15, now + idx * 0.08);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);
            noteOsc.start(now + idx * 0.08);
            noteOsc.stop(now + idx * 0.08 + 0.2);
          });
        }
      } catch(e) {}
    }

    function toggleAudio() {

    }

          <div class="flex flex-col gap-2 mt-1" dir="ltr">
            <button onclick="checkM8(1, true, this)" class="btn-brutal p-3 bg-white border-2 border-navy font-mono text-left font-bold text-xs sm:text-sm hover:bg-yellow">People who grow up using technology</button>

          </div>

      }
      // Mission 9
      else if (currentMission === 8) {

          <p class="font-arabic font-bold text-xs text-navy">اضغط على الكلمات بالترتيب الصحيح لتكوين الجملة المفيدة:</p>
          <div id="m9SentenceBox" class="bg-cream border-2 border-navy min-h-[44px] p-2 flex flex-wrap gap-1.5 font-mono text-sm font-bold text-navy" dir="ltr"></div>
          <div id="m9WordsBox" class="flex flex-wrap gap-2 mt-2" dir="ltr">

            <button onclick="addM9Word('friends', this)" class="btn-brutal px-3 py-2 bg-yellow border-2 border-navy font-mono font-bold text-xs">friends</button>
            <button onclick="addM9Word('communicate', this)" class="btn-brutal px-3 py-2 bg-yellow border-2 border-navy font-mono font-bold text-xs">communicate</button>
            <button onclick="addM9Word('online.', this)" class="btn-brutal px-3 py-2 bg-yellow border-2 border-navy font-mono font-bold text-xs">online.</button>
          </div>
          <div class="flex gap-2 mt-2" dir="ltr">
            <button onclick="checkM9()" class="btn-brutal bg-lime px-4 py-2 border-2 border-navy font-arabic font-bold text-xs">تحقق من الجملة</button>
            <button onclick="resetM9()" class="btn-brutal bg-white px-3 py-2 border-2 border-navy font-arabic font-bold text-xs">إعادة</button>
          </div>
        `;
      }
      // Mission 10
      else if (currentMission === 9) {
        box.innerHTML = `
          <div class="font-mono text-xs text-orange font-bold">MISSION 10: المهمة النهائية 🏆</div>
          <div class="bg-cream border-2 border-navy p-3 font-arabic text-xs sm:text-sm text-navy leading-relaxed">
            "سلمى تحب مشاركة أفكارها أونلاين، وتتابع الأنشطة الشائعة، وتستخدم الأدوات الرقمية للتعبير عن نفسها."
          </div>
          <div class="space-y-2 mt-2" dir="rtl">
            <div class="flex items-center gap-2">
              <span class="font-arabic font-bold text-xs w-28">اتجاهات شائعة =</span>
              <select id="m10_1" class="border-2 border-navy p-1.5 font-mono text-xs bg-white flex-1 font-bold">
                <option value="">اختر الكلمة...</option>
                <option value="Trends">Trends</option>
                <option value="Opinions">Opinions</option>
                <option value="Identity">Identity</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-arabic font-bold text-xs w-28">آراء وأفكار =</span>
              <select id="m10_2" class="border-2 border-navy p-1.5 font-mono text-xs bg-white flex-1 font-bold">
                <option value="">اختر الكلمة...</option>
                <option value="Trends">Trends</option>
                <option value="Opinions">Opinions</option>
                <option value="Identity">Identity</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-arabic font-bold text-xs w-28">الهوية الشخصية =</span>
              <select id="m10_3" class="border-2 border-navy p-1.5 font-mono text-xs bg-white flex-1 font-bold">
                <option value="">اختر الكلمة...</option>
                <option value="Trends">Trends</option>
                <option value="Opinions">Opinions</option>

        `;
      }

    // --- MISSION LOGIC HANDLERS ---
    function unlockNext() {
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = false;
      nextBtn.className = 'btn-brutal w-full py-3.5 bg-orange text-white font-arabic text-base sm:text-lg font-black border-2 border-navy shadow-brutal hover:bg-yellow hover:text-navy cursor-pointer flex items-center justify-center gap-2';
      
      score += 10;
      document.getElementById('scoreText').textContent = `${score} XP`;
    }

    function showFeedback(isCorrect, title, body) {
      const panel = document.getElementById('feedbackPanel');
      const header = document.getElementById('feedbackHeader');
      const fBody = document.getElementById('feedbackBody');
      const mascot = document.getElementById('mascotIcon');

      panel.classList.remove('hidden');
      fBody.textContent = body;

      if (isCorrect) {
        playAudio('correct');
        mascot.textContent = '🎉';
        mascot.className = 'w-9 h-9 bg-lime border border-navy flex items-center justify-center text-lg flex-shrink-0';
        header.className = 'font-arabic font-black text-sm text-emerald-800';
        header.textContent = title;
        unlockNext();
      } else {
        playAudio('wrong');
        mascot.textContent = '💡';
        mascot.className = 'w-9 h-9 bg-yellow border border-navy flex items-center justify-center text-lg flex-shrink-0';
        header.className = 'font-arabic font-black text-sm text-navy';
        header.textContent = title;
      }
    }

    // M1
    function checkM1(word, isCorrect, btn) {
      if (isCorrect) {
        btn.classList.add('bg-lime');
        showFeedback(true, 'إجابة ممتازة! 👏', 'كلمة Generation تعني الجيل، وتطلق على الأشخاص المولودين في نفس الفترة الزمنية.');
      } else {
        showFeedback(false, 'محاولة قريبة! 🧐', 'الكلمة المطلوبة تعبر عن "الجيل" كاملاً وليس عن الهوايات أو الآراء.');
      }
    }

    // M2
    function checkM2() {
      const val = document.getElementById('unscrambleInput').value.trim().toUpperCase();
      if (val === 'TRENDS') {
        showFeedback(true, 'فك إحداثيات رائع! ⚡', 'كلمة TRENDS تعني اتجاهات شائعة أو صيحات منتشرة على الإنترنت.');
      } else {
        showFeedback(false, 'حاول مجدداً! 💡', 'تلميح: الكلمة تبدأ بحرف T وتتكون من 6 حروف (TRENDS).');
      }
    }

    // M3
    let selectedWord = null;
    let selectedMeaning = null;
    let m3Matches = 0;

    function selectM3Word(word, id) {
      selectedWord = word;
      document.querySelectorAll('[id^="m3_word_"]').forEach(b => b.classList.remove('bg-yellow'));
      document.getElementById(`m3_word_${id}`).classList.add('bg-yellow');
      checkM3Match();
    }

    function selectM3Meaning(meaning, id) {
      selectedMeaning = meaning;
      document.querySelectorAll('[id^="m3_meaning_"]').forEach(b => b.classList.remove('bg-yellow'));
      document.getElementById(`m3_meaning_${id}`).classList.add('bg-yellow');
      checkM3Match();
    }

    function checkM3Match() {
      if (selectedWord && selectedMeaning) {
        if (
          (selectedWord === 'Communicate' && selectedMeaning === 'يتواصل') ||
          (selectedWord === 'Identity' && selectedMeaning === 'الهوية') ||
          (selectedWord === 'Hobbies' && selectedMeaning === 'هوايات')
        ) {
          playAudio('correct');
          m3Matches++;
          selectedWord = null;
          selectedMeaning = null;
          if (m3Matches >= 3) {
            showFeedback(true, 'توصيل كامل وصحيح! 🎯', 'أتقنت ربط الكلمات الثلاث بمعانيها العربية!');
          }
        } else {
          playAudio('wrong');
          selectedWord = null;
          selectedMeaning = null;
        }
      }
    }

    // M4
    function checkM4(word, isCorrect, btn) {
      if (isCorrect) {
        btn.classList.add('bg-lime');
        showFeedback(true, 'إجابة صحيحة! 📱', 'Screen time تعني وقت الشاشة وهو الوقت المستخدم أمام الشاشات الإلكترونية.');
      } else {
        showFeedback(false, 'فكر مجدداً! 💡', 'أولياء الأمور يحاولون تقليل وقت الشاشة أمام الأجهزة.');
      }
    }

    // M5
    function checkM5(word, isCorrect, btn) {
      if (isCorrect) {
        btn.classList.add('bg-lime');
        showFeedback(true, 'اكتشاف ذكي للكلمة الدخيلة! 🏆', 'Hobbies هي أنشطة يمارسها الشخص، بينما باقي الكلمات مرتبطة بالمحتوى والتواصل الرقمي.');
      } else {
        showFeedback(false, 'حاول مرة أخرى! 🧐', 'فكر في الأنشطة الشخصية مقارنة بالمحتوى الرقمي المنتشر أونلاين.');
      }
    }

    // M6
    function checkM6(word, isCorrect, btn) {
      if (isCorrect) {
        btn.classList.add('bg-lime');
        showFeedback(true, 'استنتاج ممتاز! ⚖️', 'Balance تعني التوازن بين الألعاب الرقمية والأنشطة الواقعية الحقيقية.');
      } else {
        showFeedback(false, 'تلميح بسيط! 💡', 'الموقف يعبر عن التوازن (Balance) بين الألعاب أونلاين والرياضة مع الأصدقاء.');
      }
    }

    // M7
    function checkM7(word, isCorrect, btn) {
      if (isCorrect) {
        btn.classList.add('bg-lime');
        showFeedback(true, 'تصحيح دقيق! 😊', 'Emojis هي الرموز التعبيرية المستخدمة في الرسائل لإظهار المشاعر بشكل سريع وممتع.');
      } else {
        showFeedback(false, 'راجع الجملة! 💡', 'الرموز التعبيرية في المحادثات بنسميها Emojis.');
      }
    }

    // M8
    function checkM8(num, isCorrect, btn) {
      if (isCorrect) {
        btn.classList.add('bg-lime');
        showFeedback(true, 'فهم رائع للسياق! 🚀', 'Digital natives هما الأشخاص الذين ينشأون ويتعلمون استخدام التكنولوجيا منذ صغرهم.');
      } else {
        showFeedback(false, 'حاول مجدداً! 🧐', 'المقصود بالجيل الرقمي هما من كبروا وتعودوا على التكنولوجيا من الصغر.');
      }
    }

    // M9
    let m9Words = [];
    function addM9Word(w, btn) {
      playAudio('blip');
      m9Words.push(w);
      btn.disabled = true;
      btn.classList.add('opacity-40');
      document.getElementById('m9SentenceBox').textContent = m9Words.join(' ');
    }

    function resetM9() {
      m9Words = [];
      document.getElementById('m9SentenceBox').textContent = '';
      document.querySelectorAll('#m9WordsBox button').forEach(b => {
        b.disabled = false;
        b.classList.remove('opacity-40');
      });
    }

    function checkM9() {
      if (m9Words.join(' ') === 'Their friends communicate online.') {
        showFeedback(true, 'تركيب جملة مثالي! ✍️', 'الجملة الصحيحة: Their friends communicate online.');
      } else {
        showFeedback(false, 'حاول ترتيب الكلمات! 💡', 'ابدأ بكلمة Their ثم الفاعل friends ثم الفعل communicate.');
      }
    }

    // M10
    function checkM10() {
      const v1 = document.getElementById('m10_1').value;
      const v2 = document.getElementById('m10_2').value;
      const v3 = document.getElementById('m10_3').value;

      if (v1 === 'Trends' && v2 === 'Opinions' && v3 === 'Identity') {
        showFeedback(true, 'إتقان كامل لمهام المفردات! 👑', 'نجحت في ربط المصطلحات الثلاثة بسياق سلمى بشكل صحيح تماماً!');
      } else {
        showFeedback(false, 'راجع الخيارات! 💡', 'اتجاهات شائعة = Trends, آراء = Opinions, الهوية = Identity.');
      }
    }

    function nextMission() {
      if (currentMission < 9) {
        currentMission++;
        renderMission();
      } else {
        playAudio('fanfare');
        document.getElementById('finalScore').textContent = `${score} XP`;
        document.getElementById('finalModal').classList.remove('hidden');
      }
    }

    function restartChallenge() {
      currentMission = 0;
      score = 0;
      m3Matches = 0;
      document.getElementById('scoreText').textContent = `0 XP`;
      document.getElementById('finalModal').classList.add('hidden');
      renderMission();
    }
function goToThinkPairShare() {
  window.location.href = "l1-5-think-pair-share.html";
}
    // Initialize Game
    renderMission();
  </script>
